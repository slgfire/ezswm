packages:
  - 'docs'
  - 'mcp'

# Auto-managed by `pnpm approve-builds`. Whitelist of packages
# allowed to run install/postinstall scripts (native binaries).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true

# Approved exception for the consolidated Dependabot Playwright update only.
minimumReleaseAgeExclude:
  - '@playwright/test@1.65.0'
  - 'playwright@1.65.0'
  - 'playwright-core@1.65.0'
